name: Build and Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "articles/published/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          mkdir -p _site/articles

          # Home page
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Aqevryn Research</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #1f2328; max-width: 800px; margin: 0 auto; padding: 20px; }
                  header { border-bottom: 1px solid #d0d7de; padding: 20px 0; margin-bottom: 20px; }
                  header h1 { font-size: 1.4em; }
                  header nav a { color: #0969da; text-decoration: none; margin-right: 16px; }
                  header nav a:hover { text-decoration: underline; }
                  h1 { font-size: 1.8em; margin-bottom: 16px; }
                  .hero { padding: 40px 0; text-align: center; }
                  .hero h1 { font-size: 2.4em; }
                  .hero p { font-size: 1.2em; color: #656d76; }
                  .article-card { padding: 20px; border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 16px; }
                  .article-card h2 { margin-bottom: 8px; }
                  .article-card h2 a { color: #1f2328; text-decoration: none; }
                  .article-card h2 a:hover { color: #0969da; }
                  .article-card .meta { color: #656d76; font-size: 0.9em; margin-bottom: 8px; }
                  footer { border-top: 1px solid #d0d7de; padding: 20px 0; margin-top: 40px; color: #656d76; }
                  @media (max-width: 600px) { body { padding: 12px; } }
              </style>
          </head>
          <body>
              <header>
                  <h1>Aqevryn Research</h1>
                  <nav>
                      <a href="/">Home</a>
                      <a href="/about">About</a>
                      <a href="/methodology">Methodology</a>
                  </nav>
              </header>
              <main>
                  <section class="hero">
                      <h1>Aqevryn Research</h1>
                      <p>Autonomous technology intelligence, research, and analysis.</p>
                  </section>
                  <section>
                      <h2>Latest Research</h2>
          EOF

          # Add articles
          found=0
          for f in articles/published/*.md; do
            if [ -f "$f" ]; then
              found=1
              # Extract title from YAML front matter
              title=$(grep "^title:" "$f" | head -1 | sed 's/^title: *"//' | sed 's/"$//' | sed "s/^title: *//")
              slug=$(basename "$f" .md)
              date=$(grep "^date:" "$f" | head -1 | sed 's/^date: *//')
              echo "<article class='article-card'><h2><a href='/articles/${slug}.html'>${title}</a></h2><div class='meta'>${date}</div></article>" >> _site/index.html
              
              # Create article page
              cat > "_site/articles/${slug}.html" << EOF2
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>${title} - Aqevryn Research</title>
              <link rel="stylesheet" href="/style.css">
          </head>
          <body>
              <header>
                  <h1><a href="/" style="color:inherit;text-decoration:none">Aqevryn Research</a></h1>
                  <nav><a href="/">Home</a><a href="/about">About</a><a href="/methodology">Methodology</a></nav>
              </header>
              <main>
                  <article>
          EOF2
              # Add body content - skip YAML front matter
              sed '1,/^---$/d' "$f" >> "_site/articles/${slug}.html"
              echo "</article></main><footer><p>Generated by Aqevryn</p></footer></body></html>" >> "_site/articles/${slug}.html"
            fi
          done

          if [ "$found" = "0" ]; then
            echo "<p>No articles published yet.</p>" >> _site/index.html
          fi

          cat >> _site/index.html << 'EOF'
                  </section>
              </main>
              <footer><p>Generated by <a href="https://github.com/aqevryn-cloud/aqevryn">Aqevryn</a></p></footer>
          </body>
          </html>
          EOF

          # About page
          cat > _site/about.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>About - Aqevryn Research</title><link rel="stylesheet" href="style.css"></head>
          <body>
              <header><h1><a href="/" style="color:inherit;text-decoration:none">Aqevryn Research</a></h1><nav><a href="/">Home</a><a href="/about">About</a><a href="/methodology">Methodology</a></nav></header>
              <main><h1>About Aqevryn</h1><p>Aqevryn is an autonomous technology research and publishing system.</p><p>It continuously discovers emerging technology developments, evaluates their significance, conducts evidence-based research, and publishes original findings.</p></main>
              <footer><p>Generated by Aqevryn</p></footer>
          </body>
          </html>
          EOF

          # Methodology page
          cat > _site/methodology.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Methodology - Aqevryn Research</title><link rel="stylesheet" href="style.css"></head>
          <body>
              <header><h1><a href="/" style="color:inherit;text-decoration:none">Aqevryn Research</a></h1><nav><a href="/">Home</a><a href="/about">About</a><a href="/methodology">Methodology</a></nav></header>
              <main><h1>Research Methodology</h1><p>Topics are discovered through keyword-based extraction from collected articles across 16 technology categories, combined with LLM-based refinement.</p><p>Sources are classified by type with configurable reliability scores.</p><p>Topics are scored across five dimensions with configurable weights.</p><p>Research uses a multi-stage pipeline: planning, source retrieval, evidence extraction, contradiction detection, and conclusion formation.</p><p>Every claim is validated against its source.</p></main>
              <footer><p>Generated by Aqevryn</p></footer>
          </body>
          </html>
          EOF

          # CSS
          cat > _site/style.css << 'CSSEOF'
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #1f2328; max-width: 800px; margin: 0 auto; padding: 20px; }
          header { border-bottom: 1px solid #d0d7de; padding: 20px 0; margin-bottom: 20px; }
          header nav a { color: #0969da; text-decoration: none; margin-right: 16px; }
          h1 { font-size: 1.8em; margin-bottom: 16px; }
          h2 { font-size: 1.4em; margin: 24px 0 12px; border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }
          p { margin-bottom: 16px; }
          .hero { padding: 40px 0; text-align: center; }
          .hero h1 { font-size: 2.4em; }
          .hero p { font-size: 1.2em; color: #656d76; }
          .article-card { padding: 20px; border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 16px; }
          .article-card h2 { margin-bottom: 8px; }
          .article-card h2 a { color: #1f2328; text-decoration: none; }
          .article-card h2 a:hover { color: #0969da; }
          .article-card .meta { color: #656d76; font-size: 0.9em; }
          footer { border-top: 1px solid #d0d7de; padding: 20px 0; margin-top: 40px; color: #656d76; }
          pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
          @media (max-width: 600px) { body { padding: 12px; } h1 { font-size: 1.4em; } }
          CSSEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4